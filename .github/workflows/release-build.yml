name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            script: npm run pack:win -- --publish never
            artifact: nacos-sync-tool-windows
            paths: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - name: macOS
            os: macos-15-intel
            script: npm run pack:mac -- --publish never
            artifact: nacos-sync-tool-macos
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build renderer and main process
        run: npm run build

      - name: Package app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: List package output
        if: always()
        shell: bash
        run: |
          if [ -d dist ]; then
            find dist -maxdepth 2 -type f -print
          else
            echo "dist directory was not created"
          fi

      - name: Upload builder diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-diagnostics
          path: |
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
          if-no-files-found: ignore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Automated desktop builds for $TAG_NAME." --latest
          fi
          while IFS= read -r -d '' file; do
            gh release upload "$TAG_NAME" "$file" --clobber
          done < <(find release-artifacts -type f -print0)
