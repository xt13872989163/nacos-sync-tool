name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            script: npm run pack:win -- --publish never
            artifact: nacos-sync-tool-windows
            paths: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - name: macOS
            os: macos-15-intel
            script: npm run pack:mac -- --publish never
            artifact: nacos-sync-tool-macos
            paths: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build renderer and main process
        run: npm run build

      - name: Package app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: List package output
        if: always()
        shell: bash
        run: |
          if [ -d dist ]; then
            find dist -maxdepth 2 -type f -print
          else
            echo "dist directory was not created"
          fi

      - name: Upload builder diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-diagnostics
          path: |
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
          if-no-files-found: ignore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  native-windows:
    name: Package Native Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore native Windows project
        run: dotnet restore native/windows/NacosSyncTool.Windows.sln

      - name: Build native Windows project
        run: dotnet build native/windows/NacosSyncTool.Windows.sln --configuration Release --no-restore

      - name: Test native Windows project
        run: dotnet test native/windows/NacosSyncTool.Windows.sln --configuration Release --no-build --verbosity normal

      - name: Publish native Windows app
        run: >
          dotnet publish native/windows/src/NacosSyncTool.Windows/NacosSyncTool.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output dist/native-windows
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Rename native Windows executable
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $source = "dist/native-windows/Nacos.Sync.Tool.Native.Windows.exe"
          $target = "dist/native-windows/Nacos.Sync.Tool.Native.Windows-$version.exe"
          Move-Item -LiteralPath $source -Destination $target

      - name: Create native Windows zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive `
            -LiteralPath "dist/native-windows/Nacos.Sync.Tool.Native.Windows-$version.exe" `
            -DestinationPath "dist/Nacos.Sync.Tool.Native.Windows-$version.zip" `
            -Force

      - name: List native package output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse -File | ForEach-Object { $_.FullName }
          } else {
            Write-Output "dist directory was not created"
          }

      - name: Upload native Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nacos-sync-tool-native-windows
          path: |
            dist/native-windows/*.exe
            dist/Nacos.Sync.Tool.Native.Windows-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package
      - native-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Automated desktop builds for ${{ github.ref_name }}.
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
